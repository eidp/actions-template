name: build

on:
  pull_request:
    branches:
    - main

env:
  RENDERED_REPO_PATH: 'rendered-repo'

concurrency:
  group: 'pr-${{ github.event.pull_request.number }}'
  cancel-in-progress: true

jobs:
  test-template-actions:
    runs-on: kubernetes-runner

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Generate GitHub App token
      id: generate-token
      uses: actions/create-github-app-token@7bd03711494f032dfa3be3558f7dc8787b0be333 # v3.1.0
      with:
        app-id: ${{ secrets.TEMPLATE_MANAGER_GITHUB_APP_ID }}
        private-key: ${{ secrets.TEMPLATE_MANAGER_GITHUB_APP_PEM_FILE }}

    - name: test-template
      uses: ./test-template
      with:
        template-path: 'test/template'

    - name: update-rendered-template
      uses: ./update-rendered-template
      with:
        github-token: ${{ steps.generate-token.outputs.token }}
        rendered-repo-path: ${{ env.RENDERED_REPO_PATH }}
        rendered-template-repo-owner: ${{ github.repository_owner }}
        rendered-template-repo: ${{ github.event.repository.name }}
        rendered-template-path: './test/actions-template-test'
        rendered-template-branch: ${{ github.head_ref }}
        update-cruft-metadata: 'true'

    - name: verify rendered template updated
      working-directory: ${{ env.RENDERED_REPO_PATH }}
      run: |
        if ! git diff --quiet -- 'test/actions-template-test/.cruft.json'; then
          echo ".cruft.json has been modified."
          exit 0
        else
          echo "No changes detected in .cruft.json. Exiting with failure."
          exit 1
        fi

    - name: create rendered-template-pr
      id: create-rendered-template-pr
      uses: ./create-rendered-template-pr
      with:
        github-token: ${{ steps.generate-token.outputs.token }}
        rendered-repo-path: ${{ env.RENDERED_REPO_PATH }}

    - name: Validate that the rendered template PR is created
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        github-token: ${{ steps.generate-token.outputs.token }}
        script: |
          const prNumber = '${{ steps.create-rendered-template-pr.outputs.pull-request-number }}';
          if (!prNumber) {
              throw new Error('Pull request number is not available. The PR may not have been created successfully.');
          }
          github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
          }).then(() => {
              console.log(`Pull request #${prNumber} exists.`);
          }).catch((error) => {
              throw new Error(`Pull request #${prNumber} does not exist. Error: ${error.message}`);
          });

    - name: Monitor rendered template PR workflow status
      uses: ./monitor-rendered-template-workflow-status
      with:
        github-token: ${{ steps.generate-token.outputs.token }}
        rendered-template-repo-owner: ${{ github.repository_owner }}
        rendered-template-repo: ${{ github.event.repository.name }}
        rendered-template-workflow: 'template-build.yml'

    - name: Clean up rendered template PR & branch
      if: always()
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: |
            const prNumber = '${{ steps.create-rendered-template-pr.outputs.pull-request-number }}';
            if (prNumber) {
                await github.rest.pulls.update({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: prNumber,
                    state: 'closed'
                });
                console.log(`Pull request #${prNumber} has been closed.`);
            } else {
                console.log('No pull request number found to close.');
            }
            
            const branchName = 'template-update/${{ github.event.pull_request.number }}';
            try {
                await github.rest.git.deleteRef({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    ref: `heads/${branchName}`
                });
                console.log(`Branch '${branchName}' has been deleted.`);
            } catch (error) {
                console.log(`Branch '${branchName}' could not be deleted or does not exist. Error: ${error.message}`);
            }

  check-workflow-status:
    runs-on: kubernetes-runner
    permissions:
      contents: read
      actions: read
    steps:
    - name: Check Workflow Status
      id: check-workflow-status
      uses: eidp/actions-common/check-workflow-status@8c3a21b463a1323f4b91307c0505ef837bbc8090 # v1.3.5
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
