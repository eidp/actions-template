name: auto-manage-rendered-template-pr

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'The type of runner to run the job on'
        required: false
        type: string
        default: 'ubuntu-latest'
      template-manager-app-id:
        description: 'GitHub App ID for the Template Manager App'
        required: true
        type: string
      rendered-template-repo-owner:
        description: 'The owner of the rendered template repository (e.g. `eidp`).'
        required: true
        type: string
      rendered-template-repo:
        description: 'The rendered template repository to update (e.g. `python-fastapi`).'
        required: true
        type: string
    secrets:
      template-manager-app-pem-file:
        description: 'GitHub App PEM file for the Template Manager App'
        required: true

jobs:
  auto-merge:
    # Only run if the PR was merged, not just closed
    if: github.event.pull_request.merged == true
    runs-on: kubernetes-runner

    steps:
      - name: Generate GitHub App token
        id: generate-token
        uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42 # v2.1.4
        with:
          app-id: ${{ secrets.TEMPLATE_MANAGER_GITHUB_APP_ID }}
          private-key: ${{ secrets.TEMPLATE_MANAGER_GITHUB_APP_PEM_FILE }}
          owner: ${{ inputs.rendered-template-repo-owner }}
          repositories: ${{ inputs.rendered-template-repo }}

      - name: Install GitHub CLI
        uses: ksivamuthu/actions-setup-gh-cli@c78dbed4be2f8d6133a14a9a597ee12fd4ed5c93 # v3

      - name: Find and auto-merge rendered repo PR
        shell: bash
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          set -e

          BRANCH="template-update/${{ github.event.pull_request.number }}"
          REPO="${{ github.repository_owner }}/${{ inputs.rendered-template-repo }}"

          echo "Looking for PR with branch: $BRANCH in repo: $REPO"

          # Find the PR by branch name
          PR_NUMBER=$(gh pr list \
            --repo "$REPO" \
            --head "$BRANCH" \
            --json number \
            --jq '.[0].number')

          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "::warning::No corresponding PR found in rendered repo with branch $BRANCH"
            echo "This might be expected if the rendered repo PR was already merged or closed."
            exit 0
          fi

          echo "Found PR #$PR_NUMBER in rendered repo"

          # Check PR state
          PR_STATE=$(gh pr view "$PR_NUMBER" \
            --repo "$REPO" \
            --json state \
            --jq '.state')

          echo "PR state: $PR_STATE"

          if [ "$PR_STATE" != "OPEN" ]; then
            echo "::warning::PR #$PR_NUMBER is not open (state: $PR_STATE). Skipping auto-merge."
            exit 0
          fi

          # Enable auto-merge
          echo "Enabling auto-merge for PR #$PR_NUMBER..."
          gh pr merge "$PR_NUMBER" \
            --repo "$REPO" \
            --auto \
            --merge

          echo "✅ Auto-merge enabled for PR #$PR_NUMBER"
          echo "The PR will be automatically merged once all required status checks pass and any required reviews are approved."

  auto-close:
    # Only run if the PR was closed and not merged
    if: github.event.pull_request.merged == false
    runs-on: kubernetes-runner

    steps:
      - name: Generate GitHub App token
        id: generate-token
        uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42 # v2.1.4
        with:
          app-id: ${{ secrets.TEMPLATE_MANAGER_GITHUB_APP_ID }}
          private-key: ${{ secrets.TEMPLATE_MANAGER_GITHUB_APP_PEM_FILE }}
          owner: ${{ inputs.rendered-template-repo-owner }}
          repositories: ${{ inputs.rendered-template-repo }}

      - name: Install GitHub CLI
        uses: ksivamuthu/actions-setup-gh-cli@c78dbed4be2f8d6133a14a9a597ee12fd4ed5c93 # v3

      - name: Find and close rendered repo PR
        shell: bash
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          set -e

          BRANCH="template-update/${{ github.event.pull_request.number }}"
          REPO="${{ github.repository_owner }}/${{ inputs.rendered-template-repo }}"

          echo "Looking for PR with branch: $BRANCH in repo: $REPO"

          # Find the PR by branch name
          PR_NUMBER=$(gh pr list \
            --repo "$REPO" \
            --head "$BRANCH" \
            --json number \
            --jq '.[0].number')

          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "::warning::No corresponding PR found in rendered repo with branch $BRANCH"
            echo "This might be expected if the rendered repo PR was already merged or closed."
            exit 0
          fi

          echo "Found PR #$PR_NUMBER in rendered repo"

          # Check PR state
          PR_STATE=$(gh pr view "$PR_NUMBER" \
            --repo "$REPO" \
            --json state \
            --jq '.state')

          echo "PR state: $PR_STATE"

          if [ "$PR_STATE" != "OPEN" ]; then
            echo "::warning::PR #$PR_NUMBER is not open (state: $PR_STATE). Skipping close."
            exit 0
          fi

          # Close the PR
          echo "Closing PR #$PR_NUMBER..."
          gh pr close "$PR_NUMBER" \
            --repo "$REPO" \
            --delete-branch
