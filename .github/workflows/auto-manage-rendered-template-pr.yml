name: auto-manage-rendered-template-pr

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'The type of runner to run the job on'
        required: false
        type: string
        default: 'ubuntu-latest'
      rendered-template-repo-owner:
        description: 'The owner of the rendered template repository (e.g. `eidp`).'
        required: true
        type: string
      rendered-template-repo:
        description: 'The rendered template repository to update (e.g. `python-fastapi`).'
        required: true
        type: string
    secrets:
      template-manager-app-id:
        description: 'GitHub App ID for the Template Manager App'
        required: true
      template-manager-app-pem-file:
        description: 'GitHub App PEM file for the Template Manager App'
        required: true

jobs:
  auto-merge:
    # Only run if the PR was merged, not just closed
    if: github.event.pull_request.merged == true
    runs-on: kubernetes-runner

    steps:
    - name: Generate GitHub App token
      id: generate-token
      uses: actions/create-github-app-token@7e473efe3cb98aa54f8d4bac15400b15fad77d94 # v2.2.0
      with:
        app-id: ${{ secrets.template-manager-app-id }}
        private-key: ${{ secrets.template-manager-app-pem-file }}
        owner: ${{ inputs.rendered-template-repo-owner }}
        repositories: ${{ inputs.rendered-template-repo }}

    - name: Find and auto-merge rendered repo PR
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      with:
        github-token: ${{ steps.generate-token.outputs.token }}
        script: |
          const branch = `template-update/${{ github.event.pull_request.number }}`;
          const owner = '${{ github.repository_owner }}';
          const repo = '${{ inputs.rendered-template-repo }}';
          
          core.info(`Looking for PR with branch: ${branch} in repo: ${owner}/${repo}`);
          
          // Find the PR by branch name
          const { data: prs } = await github.rest.pulls.list({
            owner,
            repo,
            head: `${owner}:${branch}`,
            state: 'open'
          });
          
          if (prs.length === 0) {
            core.warning(`No corresponding PR found in rendered repo with branch ${branch}`);
            core.info('This might be expected if the rendered repo PR was already merged or closed.');
            return;
          }
          
          const pr = prs[0];
          core.info(`Found PR #${pr.number} in rendered repo`);
          core.info(`PR state: ${pr.state}`);
          
          if (pr.state !== 'open') {
            core.warning(`PR #${pr.number} is not open (state: ${pr.state}). Skipping auto-merge.`);
            return;
          }
          
          // Merge the PR
          core.info(`Merging PR #${pr.number}...`);
          await github.rest.pulls.merge({
            owner,
            repo,
            pull_number: pr.number,
            merge_method: 'merge'
          });
          core.info(`✅ PR #${pr.number} merged successfully`);

  update-cruft-metadata:
    # Update .cruft.json after the rendered repo PR is merged to reference the updated stable main branch commit
    needs: auto-merge
    if: github.event.pull_request.merged == true
    runs-on: ${{ inputs.runs-on }}

    steps:
    - name: Generate GitHub App token
      id: generate-token
      uses: actions/create-github-app-token@7e473efe3cb98aa54f8d4bac15400b15fad77d94 # v2.2.0
      with:
        app-id: ${{ secrets.template-manager-app-id }}
        private-key: ${{ secrets.template-manager-app-pem-file }}
        owner: ${{ inputs.rendered-template-repo-owner }}
        repositories: ${{ inputs.rendered-template-repo }}

    - name: Wait for rendered repo PR to merge
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      with:
        github-token: ${{ steps.generate-token.outputs.token }}
        script: |
          const branch = `template-update/${{ github.event.pull_request.number }}`;
          const owner = '${{ github.repository_owner }}';
          const repo = '${{ inputs.rendered-template-repo }}';

          core.info(`Waiting for PR with branch ${branch} to be merged...`);

          let maxAttempts = 30;
          let attempt = 0;

          while (attempt < maxAttempts) {
            const { data: prs } = await github.rest.pulls.list({
              owner,
              repo,
              head: `${owner}:${branch}`,
              state: 'all'
            });

            if (prs.length === 0) {
              core.warning(`No PR found with branch ${branch}`);
              return;
            }

            const pr = prs[0];

            if (pr.merged) {
              core.info(`PR #${pr.number} has been merged`);
              return;
            }

            if (pr.state === 'closed' && !pr.merged) {
              core.warning(`PR #${pr.number} was closed without merging`);
              return;
            }

            core.info(`Attempt ${attempt + 1}/${maxAttempts}: PR #${pr.number} is still open, waiting...`);
            await new Promise(resolve => setTimeout(resolve, 10000));
            attempt++;
          }

          core.warning(`Timeout waiting for PR to merge after ${maxAttempts * 10} seconds`);

    - name: Update rendered template from main branch
      uses: eidp/actions-template/update-rendered-template@0dd8458cf0c2ef7a5d86ed2734b182394a24ffbe
      with:
        github-token: ${{ steps.generate-token.outputs.token }}
        rendered-template-repo-owner: ${{ inputs.rendered-template-repo-owner }}
        rendered-template-repo: ${{ inputs.rendered-template-repo }}
        template-branch: main
        update-cruft-metadata: true

    - name: Commit and push .cruft.json update
      shell: bash
      working-directory: rendered-repo
      run: |
        set -e

        # Check if there are changes to commit
        if git diff --quiet .cruft.json 2>/dev/null; then
          echo "No changes to .cruft.json, nothing to commit"
          exit 0
        fi

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        git add .cruft.json
        git commit -m "chore: update .cruft.json to reference main branch commit

  auto-close:
    # Only run if the PR was closed and not merged
    if: github.event.pull_request.merged == false
    runs-on: kubernetes-runner

    steps:
    - name: Generate GitHub App token
      id: generate-token
      uses: actions/create-github-app-token@7e473efe3cb98aa54f8d4bac15400b15fad77d94 # v2.2.0
      with:
        app-id: ${{ secrets.template-manager-app-id }}
        private-key: ${{ secrets.template-manager-app-pem-file }}
        owner: ${{ inputs.rendered-template-repo-owner }}
        repositories: ${{ inputs.rendered-template-repo }}

    - name: Find and close rendered repo PR
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      with:
        github-token: ${{ steps.generate-token.outputs.token }}
        script: |
          const branch = `template-update/${{ github.event.pull_request.number }}`;
          const owner = '${{ github.repository_owner }}';
          const repo = '${{ inputs.rendered-template-repo }}';
          
          core.info(`Looking for PR with branch: ${branch} in repo: ${owner}/${repo}`);

          // Find the PR by branch name
          const { data: prs } = await github.rest.pulls.list({
            owner,
            repo,
            head: `${owner}:${branch}`,
            state: 'open'
          });

          if (prs.length === 0) {
            core.warning(`No corresponding PR found in rendered repo with branch ${branch}`);
            core.info('This might be expected if the rendered repo PR was already merged or closed.');
            return;
          }

          const pr = prs[0];
          core.info(`Found PR #${pr.number} in rendered repo`);
          core.info(`PR state: ${pr.state}`);
          
          if (pr.state !== 'open') {
            core.warning(`PR #${pr.number} is not open (state: ${pr.state}). Skipping close.`);
            return;
          }

          // Close the PR
          core.info(`Closing PR #${pr.number}...`);
          await github.rest.pulls.update({
            owner,
            repo,
            pull_number: pr.number,
            state: 'closed'
          });

          // Delete the branch
          try {
            await github.rest.git.deleteRef({
              owner,
              repo,
              ref: `heads/${branch}`
            });
            core.info(`Deleted branch ${branch}`);
          } catch (error) {
            core.warning(`Failed to delete branch ${branch}: ${error.message}`);
          }
