name: 'Test template'
description: |
  Action that tests template rendering using cookiecutter.
  It verifies that all template variables are replaced in the rendered output.
  The rendered template is uploaded as an artifact for further inspection.

author: EIDP
branding:
  color: 'orange'
  icon: 'check'

inputs:
  template-path:
    description: 'Path to the cookiecutter template to test.'
    required: false
    default: '.'

runs:
  using: 'composite'
  steps:
  - name: Set up Python
    uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
    with:
      python-version: '3.14'

  - name: Install cookiecutter
    shell: bash
    run: pip install cookiecutter

  - name: Render template with test values
    shell: bash
    run: |
      set -e

      # Render the template
      cookiecutter ${{ inputs.template-path }} --no-input --output-dir /tmp/rendered

      echo "Template rendered successfully"

  - name: Check for cookiecutter template variables in rendered output
    shell: bash
    run: |
      set -e

      RENDERED_DIR="/tmp/rendered"

      echo "Checking for unreplaced template variables..."

      # Search for common cookiecutter patterns that shouldn't be in rendered output
      # Excluding certain files that could legitimately contain these patterns
      # Use || true to prevent grep from failing the script when no matches are found
      FOUND=$(grep -r "{{ cookiecutter\." "$RENDERED_DIR" \
          --exclude-dir=".git" \
          --exclude-dir="node_modules" \
          --exclude-dir="__pycache__" \
          --exclude="*.pyc" 2>/dev/null || true)

      if [ -n "$FOUND" ]; then
        echo "::error::Found unreplaced cookiecutter variables in rendered template"
        echo "$FOUND"
        exit 1
      fi

      echo "No unreplaced template variables found"

  - name: Upload rendered template as artifact
    uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
    if: always()
    with:
      name: rendered-template
      path: /tmp/rendered
      retention-days: 7
